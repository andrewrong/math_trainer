<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="42" y="62" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#1e40af">Ratio bars: equal units keep the relationship</text>
  <text x="42" y="94" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">A ratio part is a unit. Find one unit before finding real amounts.</text>
  <text x="76" y="165" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">Red : Blue = 2 : 3</text>
  <g transform="translate(76 205)">
    <text x="0" y="36" font-family="Inter, Arial, sans-serif" font-size="18" fill="#374151">Red</text>
    <rect x="70" y="0" width="90" height="50" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <rect x="160" y="0" width="90" height="50" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <text x="107" y="32" font-family="Inter, Arial, sans-serif" font-size="18" fill="#c2410c">1</text>
    <text x="197" y="32" font-family="Inter, Arial, sans-serif" font-size="18" fill="#c2410c">1</text>
  </g>
  <g transform="translate(76 290)">
    <text x="0" y="36" font-family="Inter, Arial, sans-serif" font-size="18" fill="#374151">Blue</text>
    <rect x="70" y="0" width="90" height="50" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <rect x="160" y="0" width="90" height="50" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <rect x="250" y="0" width="90" height="50" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <text x="107" y="32" font-family="Inter, Arial, sans-serif" font-size="18" fill="#1e40af">1</text>
    <text x="197" y="32" font-family="Inter, Arial, sans-serif" font-size="18" fill="#1e40af">1</text>
    <text x="287" y="32" font-family="Inter, Arial, sans-serif" font-size="18" fill="#1e40af">1</text>
  </g>
  <rect x="560" y="160" width="340" height="240" rx="16" fill="#eff6ff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="590" y="202" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">If total = 25</text>
  <text x="590" y="248" font-family="Inter, Arial, sans-serif" font-size="18" fill="#374151">2 + 3 = 5 units</text>
  <text x="590" y="284" font-family="Inter, Arial, sans-serif" font-size="18" fill="#374151">25 ÷ 5 = 5 each unit</text>
  <text x="590" y="320" font-family="Inter, Arial, sans-serif" font-size="18" fill="#c2410c">Red = 2 units = 10</text>
  <text x="590" y="356" font-family="Inter, Arial, sans-serif" font-size="18" fill="#1e40af">Blue = 3 units = 15</text>
  <text x="196" y="470" font-family="Inter, Arial, sans-serif" font-size="18" fill="#92400e">Equivalent ratios scale every part: 2:3 = 4:6 = 10:15.</text>
</svg>
