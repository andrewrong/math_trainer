<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" role="img" aria-label="Nets and 2D drawings: use face kit, fold test, and slot ledger">
  <rect width="1180" height="860" fill="#ffffff"/>
  <style>
    .title{font:900 30px Arial,sans-serif;fill:#1e40af}
    .sub{font:700 17px Arial,sans-serif;fill:#64748b}
    .head{font:900 21px Arial,sans-serif;fill:#1e40af}
    .body{font:700 15px Arial,sans-serif;fill:#64748b}
    .label{font:900 14px Arial,sans-serif;fill:#374151}
    .tiny{font:800 12px Arial,sans-serif;fill:#64748b}
    .ok{font:900 15px Arial,sans-serif;fill:#047857}
    .warn{font:900 15px Arial,sans-serif;fill:#dc2626}
    .orange{font:900 15px Arial,sans-serif;fill:#c2410c}
    .slot{font:900 13px Arial,sans-serif;fill:#1e3a5f}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#1e3a5f"/>
    </marker>
  </defs>

  <text class="title" x="44" y="56">Nets are folding plans. 2D drawings are finished views.</text>
  <text class="sub" x="46" y="88">Do not just count faces. Use the three-question gate, then prove the picture works.</text>

  <g transform="translate(44 118)">
    <rect x="0" y="0" width="1092" height="86" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text class="head" x="26" y="34">Three-question gate</text>
    <text class="label" x="300" y="30">1. What view is this?</text>
    <text class="body" x="300" y="58">flat / folded / drawing</text>
    <text class="label" x="560" y="30">2. Does the face kit match?</text>
    <text class="body" x="560" y="58">right shapes + count</text>
    <text class="label" x="840" y="30">3. Can it fold or draw correctly?</text>
    <text class="body" x="840" y="58">no gaps / no overlap</text>
  </g>

  <g transform="translate(54 244)">
    <text class="head" x="0" y="0">1. Flat net = before folding</text>
    <text class="body" x="0" y="30">A net is a face map. A shared edge is a hinge.</text>
    <g transform="translate(40 72)" stroke="#1e40af" stroke-width="3">
      <rect x="72" y="0" width="62" height="62" rx="5" fill="#dbeafe"/>
      <rect x="10" y="62" width="62" height="62" rx="5" fill="#dbeafe"/>
      <rect x="72" y="62" width="62" height="62" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
      <rect x="134" y="62" width="62" height="62" rx="5" fill="#dbeafe"/>
      <rect x="72" y="124" width="62" height="62" rx="5" fill="#dbeafe"/>
      <rect x="72" y="186" width="62" height="62" rx="5" fill="#dbeafe"/>
      <text class="label" x="103" y="98" text-anchor="middle" stroke="none">base</text>
    </g>
    <text class="ok" x="38" y="350">face kit: 6 squares</text>
    <text class="orange" x="38" y="376">shared edge = hinge</text>
  </g>

  <line x1="350" y1="412" x2="425" y2="412" stroke="#1e3a5f" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(448 244)">
    <text class="head" x="0" y="0">2. Fold test = one face, one slot</text>
    <text class="body" x="0" y="30">Fold around the base. Track slots.</text>
    <text class="body" x="0" y="56">front, back, top, bottom, left, right</text>
    <g transform="translate(42 74)">
      <rect x="95" y="88" width="86" height="86" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
      <path d="M95 88 L138 45 L181 88" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
      <path d="M181 88 L224 131 L181 174" fill="#bfdbfe" stroke="#1e40af" stroke-width="3"/>
      <path d="M95 174 L138 217 L181 174" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
      <path d="M95 88 L52 131 L95 174" fill="#bfdbfe" stroke="#1e40af" stroke-width="3"/>
      <text class="slot" x="138" y="136" text-anchor="middle">base</text>
      <text class="slot" x="138" y="70" text-anchor="middle">top</text>
      <text class="slot" x="138" y="206" text-anchor="middle">bottom</text>
      <text class="slot" x="69" y="136" text-anchor="middle">left</text>
      <text class="slot" x="207" y="136" text-anchor="middle">right</text>
      <path d="M138 45 C138 70 138 84 138 104" stroke="#1e3a5f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
      <path d="M52 131 C78 131 91 131 112 131" stroke="#1e3a5f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    </g>
    <text class="ok" x="36" y="350">Valid: every face gets one place.</text>
    <text class="warn" x="36" y="376">Fail: two faces land in the same slot.</text>
  </g>

  <line x1="740" y1="412" x2="815" y2="412" stroke="#1e3a5f" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(836 244)">
    <text class="head" x="0" y="0">3. 2D drawing = after folding</text>
    <text class="body" x="0" y="30">Shows depth, not every face.</text>
    <g transform="translate(54 76)">
      <polygon points="0,70 104,70 158,22 54,22" fill="#dbeafe" stroke="#1e40af" stroke-width="4"/>
      <polygon points="104,70 158,22 158,136 104,184" fill="#bfdbfe" stroke="#1e40af" stroke-width="4"/>
      <polygon points="0,70 104,70 104,184 0,184" fill="#eff6ff" stroke="#1e40af" stroke-width="4"/>
      <line x1="54" y1="22" x2="54" y2="136" stroke="#1e40af" stroke-width="3" stroke-dasharray="8 8"/>
      <line x1="54" y1="136" x2="158" y2="136" stroke="#1e40af" stroke-width="3" stroke-dasharray="8 8"/>
      <text class="label" x="80" y="214" text-anchor="middle">hidden edges still exist</text>
    </g>
    <text class="ok" x="30" y="350">Slanting lines show depth.</text>
    <text class="body" x="30" y="376">Real faces are still squares or rectangles.</text>
  </g>

  <g transform="translate(54 636)">
    <rect x="0" y="0" width="520" height="158" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
    <text class="warn" x="28" y="30">Single-row trap:</text>
    <text class="body" x="168" y="30">six correct faces can still be arranged wrongly.</text>
    <text class="body" x="168" y="54">It makes a belt, not a box.</text>
    <g transform="translate(42 82)" stroke="#1e40af" stroke-width="2" fill="#dbeafe">
      <rect x="0" y="0" width="42" height="42" rx="4"/>
      <rect x="42" y="0" width="42" height="42" rx="4"/>
      <rect x="84" y="0" width="42" height="42" rx="4"/>
      <rect x="126" y="0" width="42" height="42" rx="4"/>
      <rect x="168" y="0" width="42" height="42" rx="4"/>
      <rect x="210" y="0" width="42" height="42" rx="4"/>
      <line x1="-8" y1="-8" x2="260" y2="50" stroke="#dc2626" stroke-width="5"/>
      <line x1="260" y1="-8" x2="-8" y2="50" stroke="#dc2626" stroke-width="5"/>
    </g>
    <text class="ok" x="330" y="96">face kit passes</text>
    <text class="warn" x="330" y="122">fold test fails</text>
  </g>

  <g transform="translate(614 636)">
    <rect x="0" y="0" width="522" height="158" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text class="head" x="26" y="30">Slot ledger = one face per slot</text>
    <text class="body" x="26" y="56">A hidden failure appears when the same slot is written twice.</text>
    <g transform="translate(28 78)">
      <rect x="0" y="0" width="220" height="54" rx="10" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
      <text class="ok" x="110" y="22" text-anchor="middle">PASS</text>
      <text class="tiny" x="110" y="42" text-anchor="middle">front top bottom left right back</text>
      <rect x="260" y="0" width="220" height="54" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
      <text class="warn" x="370" y="22" text-anchor="middle">FAIL: slot collision</text>
      <text class="tiny" x="370" y="42" text-anchor="middle">top used twice; back missing</text>
    </g>
    <text class="warn" x="28" y="150">face kit passes, slot ledger fails</text>
  </g>
</svg>
