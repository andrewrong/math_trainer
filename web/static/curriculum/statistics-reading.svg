<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-label="P4 statistics reading order for tables and line graphs">
  <rect width="1180" height="820" fill="#ffffff"/>
  <style>
    .title{font:900 32px Arial,sans-serif;fill:#1e40af}
    .sub{font:800 18px Arial,sans-serif;fill:#64748b}
    .head{font:900 22px Arial,sans-serif;fill:#1e40af}
    .body{font:700 15px Arial,sans-serif;fill:#64748b}
    .label{font:900 14px Arial,sans-serif;fill:#1e3a5f}
    .small{font:800 13px Arial,sans-serif;fill:#374151}
    .tiny{font:800 11px Arial,sans-serif;fill:#64748b}
    .green{fill:#047857}
    .orange{fill:#c2410c}
    .red{fill:#dc2626}
    .blue{fill:#1e40af}
  </style>
  <defs>
    <marker id="statArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1e40af"/>
    </marker>
  </defs>

  <text class="title" x="44" y="54">P4 Statistics: tables and line graphs</text>
  <text class="sub" x="46" y="86">Statistics gate: job -&gt; display -&gt; scale -&gt; evidence sentence. Scale audit before trend.</text>

  <rect x="44" y="116" width="1092" height="108" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="head" x="74" y="152">1. Reading order</text>
  <rect x="74" y="168" width="218" height="40" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text class="label orange" x="183" y="193" text-anchor="middle">Statistics gate: job</text>
  <text class="small" x="326" y="193">job / display / scale / evidence sentence</text>
  <line x1="600" y1="188" x2="676" y2="188" stroke="#1e40af" stroke-width="3" marker-end="url(#statArrow)"/>
  <text class="label blue" x="708" y="183">then read title, labels, unit, scale</text>
  <text class="body" x="708" y="205">Do not answer from the line shape first.</text>

  <rect x="44" y="254" width="318" height="292" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="head" x="74" y="292">2. Table = exact rows</text>
  <text class="body" x="74" y="318">Exact values live in rows.</text>
  <g transform="translate(104 346)">
    <rect x="0" y="0" width="200" height="154" rx="12" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
    <rect x="0" y="0" width="200" height="34" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
    <line x1="100" y1="0" x2="100" y2="154" stroke="#1e40af" stroke-width="2"/>
    <line x1="0" y1="34" x2="200" y2="34" stroke="#1e40af" stroke-width="2"/>
    <line x1="0" y1="64" x2="200" y2="64" stroke="#dbeafe" stroke-width="2"/>
    <line x1="0" y1="94" x2="200" y2="94" stroke="#dbeafe" stroke-width="2"/>
    <line x1="0" y1="124" x2="200" y2="124" stroke="#dbeafe" stroke-width="2"/>
    <text class="label" x="50" y="23" text-anchor="middle">Day</text>
    <text class="label" x="150" y="23" text-anchor="middle">Books</text>
    <text class="small" x="50" y="55" text-anchor="middle">Mon</text><text class="small" x="150" y="55" text-anchor="middle">12</text>
    <text class="small" x="50" y="85" text-anchor="middle">Tue</text><text class="small" x="150" y="85" text-anchor="middle">20</text>
    <text class="small" x="50" y="115" text-anchor="middle">Wed</text><text class="small" x="150" y="115" text-anchor="middle">15</text>
    <text class="small" x="50" y="145" text-anchor="middle">Thu</text><text class="small" x="150" y="145" text-anchor="middle">25</text>
  </g>
  <rect x="78" y="510" width="252" height="32" rx="12" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
  <text class="label green" x="204" y="532" text-anchor="middle">Exact row: Thu = 25</text>
  <text class="small" x="204" y="568" text-anchor="middle">Difference: Tue - Mon = 8</text>

  <rect x="394" y="254" width="348" height="292" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text class="head" x="424" y="292">3. Line graph = change</text>
  <text class="body" x="424" y="318">Line graphs need ordered data.</text>
  <g transform="translate(468 342)">
    <line x1="0" y1="138" x2="230" y2="138" stroke="#64748b" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="138" stroke="#64748b" stroke-width="3"/>
    <g stroke="#dbeafe" stroke-width="1">
      <line x1="0" y1="110" x2="230" y2="110"/><line x1="0" y1="82" x2="230" y2="82"/>
      <line x1="0" y1="54" x2="230" y2="54"/><line x1="0" y1="26" x2="230" y2="26"/>
    </g>
    <polyline points="0,110 58,54 116,82 174,26 230,48" fill="none" stroke="#1e40af" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#1e40af"><circle cx="0" cy="110" r="7"/><circle cx="58" cy="54" r="7"/><circle cx="116" cy="82" r="7"/><circle cx="174" cy="26" r="7"/><circle cx="230" cy="48" r="7"/></g>
    <text class="small" x="-10" y="116" text-anchor="end">10</text><text class="small" x="-10" y="88" text-anchor="end">15</text>
    <text class="small" x="-10" y="60" text-anchor="end">20</text><text class="small" x="-10" y="32" text-anchor="end">25</text>
    <text class="small" x="0" y="162" text-anchor="middle">Mon</text><text class="small" x="58" y="162" text-anchor="middle">Tue</text>
    <text class="small" x="116" y="162" text-anchor="middle">Wed</text><text class="small" x="174" y="162" text-anchor="middle">Thu</text><text class="small" x="230" y="162" text-anchor="middle">Fri</text>
  </g>
  <text class="label orange" x="568" y="532" text-anchor="middle">Do not count each grid line as 1.</text>

  <rect x="774" y="254" width="362" height="292" rx="22" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  <text class="head" x="804" y="292">4. Choose the operation</text>
  <text class="body" x="804" y="318">Read the words after reading the data.</text>
  <g transform="translate(812 346)">
    <rect x="0" y="0" width="286" height="39" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="label" x="16" y="25">Exact value:</text><text class="small" x="136" y="25">read one point</text>
    <rect x="0" y="50" width="286" height="39" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="label" x="16" y="75">Difference:</text><text class="small" x="136" y="75">subtract</text>
    <rect x="0" y="100" width="286" height="39" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="label" x="16" y="125">Total:</text><text class="small" x="136" y="125">add rows</text>
    <rect x="0" y="150" width="286" height="39" rx="13" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text class="label orange" x="16" y="175">Trend:</text><text class="small" x="92" y="175">direction + amount + unit</text>
  </g>
  <text class="small red" x="955" y="575" text-anchor="middle">Do not connect unrelated categories with a line.</text>

  <rect x="44" y="600" width="1092" height="202" rx="22" fill="#f8fafc" stroke="#93c5fd" stroke-width="2"/>
  <text class="head" x="74" y="636">5. Scale audit before trend</text>
  <text class="body" x="74" y="662">Same data, different vertical scale. A steep line is a clue, not proof.</text>
  <g transform="translate(78 700)">
    <text class="label" x="86" y="-8" text-anchor="middle">full scale</text>
    <line x1="0" y1="72" x2="172" y2="72" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="72" stroke="#64748b" stroke-width="2"/>
    <polyline points="0,12 58,10 116,9 172,8" fill="none" stroke="#1e40af" stroke-width="4"/>
    <text class="tiny" x="-8" y="16" text-anchor="end">100</text><text class="tiny" x="-8" y="74" text-anchor="end">0</text>
    <text class="tiny" x="0" y="92" text-anchor="middle">Mon</text><text class="tiny" x="172" y="92" text-anchor="middle">Thu</text>
  </g>
  <g transform="translate(322 700)">
    <text class="label" x="86" y="-8" text-anchor="middle">zoomed scale</text>
    <line x1="0" y1="72" x2="172" y2="72" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="72" stroke="#64748b" stroke-width="2"/>
    <polyline points="0,60 58,36 116,24 172,12" fill="none" stroke="#dc2626" stroke-width="4"/>
    <text class="tiny" x="-8" y="16" text-anchor="end">96</text><text class="tiny" x="-8" y="74" text-anchor="end">90</text>
    <text class="tiny" x="0" y="92" text-anchor="middle">Mon</text><text class="tiny" x="172" y="92" text-anchor="middle">Thu</text>
  </g>
  <rect x="566" y="650" width="520" height="92" rx="18" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
  <text class="label green" x="826" y="676" text-anchor="middle">Evidence sentence: Sales increased from 92 to 96, by 4 items.</text>
  <text class="small" x="826" y="703" text-anchor="middle">Claim + actual values + unit beats "the line looks steep".</text>
  <text class="small red" x="826" y="728" text-anchor="middle">92 -&gt; 96 = +4 items, not "a huge jump".</text>
</svg>
