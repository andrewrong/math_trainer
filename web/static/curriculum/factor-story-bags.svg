  <text x="670" y="205" text-anchor="middle" style="font:900 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b91c1c">2 apples left</text>
  <text x="790" y="185" text-anchor="start" style="font:900 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b91c1c">18 ÷ 4 = 4 remainder 2</text>
