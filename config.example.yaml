server:
  host: "0.0.0.0" # 0.0.0.0 = 局域网可访问
  port: 8080

db:
  path: "./math_trainer.db"

# Optional external AI-control interface. Leave empty to keep /api/agent/v1
# disabled. Prefer the MATHTRAINER_AUTOMATION_API_TOKEN environment variable
# instead of committing a token to config.yaml.
automation:
  api_token: ""

reading:
  content_dir: "./resources/reading"
  # Optional directories scanned for PDF/EPUB evidence sources.
  library_dirs: []
  ocr:
    # andrewrong/ocr-service on the same macOS host.
    # The client prefers /v1/ocr/image and falls back to /ocr/image on HTTP 404.
    base_url: "http://127.0.0.1:18100"
    engine: "auto" # auto, paddle, glm, or qwen
    api_key: "" # only needed when the service is behind an authenticated proxy
    timeout_seconds: 900 # allows full scanned PDFs to use OCR fallback

ai:
  # 按顺序尝试，失败则自动切换下一个
  fallback_order:
    - openrouter # 云端聚合（支持多家模型）
    - lmstudio # 本地备用
    - anthropic
    - openai
    - gemini
    - ollama # 本地优先（免费、离线）

  providers:
    anthropic:
      api_key: "" # 或 env: ANTHROPIC_API_KEY
      model: "claude-haiku-4-5-20251001"
      base_url: "https://api.anthropic.com"

    openai:
      api_key: "" # 或 env: OPENAI_API_KEY
      model: "gpt-4o-mini"
      base_url: "https://api.openai.com/v1"

    gemini:
      api_key: "" # 或 env: GEMINI_API_KEY
      model: "gemini-2.0-flash"
      base_url: "https://generativelanguage.googleapis.com"

    ollama:
      base_url: "http://localhost:11434"
      model: "qwen2.5:7b" # 文字生成
      vision_model: "llava:7b" # 图片识别（留空则跳过 vision）

    lmstudio:
      base_url: "http://localhost:1234/v1"
      model: "google/gemma-4-26b-a4b" # LM Studio 中当前加载的模型名
      api_key: "lm-studio" # LM Studio 接受任意非空 key

    openrouter:
      api_key: "" # 或 env: OPENROUTER_API_KEY，从 openrouter.ai/keys 获取
      # 模型示例（完整列表见 openrouter.ai/models）：
      #   anthropic/claude-3-5-haiku
      #   google/gemini-2.0-flash
      #   openai/gpt-4o-mini
      #   meta-llama/llama-3.1-8b-instruct:free
      model: "openai/gpt-4.1-mini"
