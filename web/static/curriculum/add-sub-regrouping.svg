<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-label="Addition and subtraction regrouping with place values">
  <style>
    .title{font:700 27px Arial,sans-serif;fill:#1e40af}.sub{font:17px Arial,sans-serif;fill:#64748b}.head{font:700 22px Arial,sans-serif;fill:#1e40af}.label{font:16px Arial,sans-serif;fill:#374151}.step{font:700 18px Arial,sans-serif;fill:#b45309}.answer{font:700 23px Arial,sans-serif;fill:#047857}.body{font:19px Arial,sans-serif;fill:#374151}
  </style>
  <rect width="980" height="520" rx="20" fill="#fff"/>
  <text x="40" y="55" class="title">Addition and subtraction keep place values in their columns</text>
  <text x="40" y="88" class="sub">Regrouping is trading value: 1 ten can become 10 ones, but the total stays the same.</text>
  <rect x="40" y="120" width="410" height="350" rx="18" fill="#eff6ff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="72" y="155" class="head">Addition: 46 + 27</text>
  <rect x="76" y="205" width="136" height="74" rx="12" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>
  <text x="144" y="232" text-anchor="middle" class="label">tens</text><text x="144" y="258" text-anchor="middle" class="label">40 + 20 = 60</text>
  <rect x="270" y="205" width="136" height="74" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="338" y="232" text-anchor="middle" class="label">ones</text><text x="338" y="258" text-anchor="middle" class="label">6 + 7 = 13</text>
  <path d="M240 287v45m0 0l-8-10m8 10l8-10" fill="none" stroke="#1e3a5f" stroke-width="2"/>
  <text x="245" y="354" text-anchor="middle" class="step">13 ones = 1 ten + 3 ones</text>
  <rect x="113" y="382" width="254" height="60" rx="12" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <text x="240" y="420" text-anchor="middle" class="answer">60 + 13 = 73</text>
  <rect x="530" y="120" width="410" height="350" rx="18" fill="#fff7ed" stroke="#1e3a5f" stroke-width="2"/>
  <text x="562" y="155" class="head">Subtraction: 72 - 38</text>
  <text x="585" y="220" class="body">72 = 7 tens + 2 ones</text>
  <rect x="580" y="250" width="310" height="62" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="735" y="287" text-anchor="middle" class="label">trade 1 ten: 72 = 6 tens + 12 ones</text>
  <text x="735" y="355" text-anchor="middle" class="body">12 - 8 = 4 ones</text>
  <text x="735" y="384" text-anchor="middle" class="body">60 - 30 = 30</text>
  <rect x="610" y="405" width="250" height="48" rx="12" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <text x="735" y="437" text-anchor="middle" class="answer">30 + 4 = 34</text>
</svg>
