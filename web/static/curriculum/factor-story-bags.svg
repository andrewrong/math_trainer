  <ellipse cx="620.0" cy="472.0" rx="10.0" ry="10.0" fill="#fdba74" stroke="#c2410c" stroke-width="2"/>
  <text x="638" y="478" text-anchor="start" style="font:700 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151">= orange, 4 in each bag (4 × 6 = 24)</text>
  <text x="40" y="525" text-anchor="start" style="font:900 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#047857">Common factors of 18 and 24: 1, 2, 3, 6. The greatest is 6 bags.</text>
  <rect x="40" y="550" width="1100" height="60" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="590" y="589" text-anchor="middle" style="font:900 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b45309">the number of bags must divide BOTH totals</text>
