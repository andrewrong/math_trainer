<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-label="Fractions shown as mixed numbers, improper fractions, and fraction of a set">
  <rect width="980" height="560" fill="#ffffff"/>
  <style>
    .title{font:800 30px Arial,sans-serif;fill:#1e40af}
    .sub{font:18px Arial,sans-serif;fill:#64748b}
    .head{font:800 21px Arial,sans-serif;fill:#1e40af}
    .body{font:16px Arial,sans-serif;fill:#64748b}
    .label{font:800 15px Arial,sans-serif;fill:#1e3a5f}
    .small{font:800 13px Arial,sans-serif;fill:#374151}
    .green{fill:#047857}
    .orange{fill:#c2410c}
    .red{fill:#dc2626}
  </style>
  <defs>
    <marker id="fracArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1e40af"/>
    </marker>
  </defs>

  <text class="title" x="40" y="54">Fractions: choose the model first</text>
  <text class="sub" x="42" y="86">Model gate: whole -&gt; equal parts -&gt; job -&gt; model.</text>
  <g transform="translate(650 28)">
    <rect x="0" y="0" width="290" height="74" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text class="label orange" x="22" y="28">Model gate</text>
    <text class="small" x="22" y="52">whole -&gt; equal parts -&gt; job -&gt; model</text>
  </g>

  <text class="head" x="46" y="130">1. Mixed number and improper fraction</text>
  <text class="body" x="46" y="156">same amount can be shown in different models</text>

  <g transform="translate(60 188)">
    <text class="label" x="0" y="-12">Count 7 fourths</text>
    <g>
      <rect x="0" y="0" width="56" height="44" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
      <rect x="62" y="0" width="56" height="44" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
      <rect x="124" y="0" width="56" height="44" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
      <rect x="186" y="0" width="56" height="44" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
      <rect x="258" y="0" width="56" height="44" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
      <rect x="320" y="0" width="56" height="44" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
      <rect x="382" y="0" width="56" height="44" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
      <text class="small" x="121" y="72" text-anchor="middle">4 fourths make 1 whole</text>
      <text class="small green" x="348" y="72" text-anchor="middle">3 fourths left</text>
    </g>

    <line x1="224" y1="92" x2="224" y2="128" stroke="#1e40af" stroke-width="4" marker-end="url(#fracArrow)"/>

    <text class="label" x="0" y="150">Rename the count</text>
    <rect x="0" y="166" width="200" height="46" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
    <line x1="50" y1="166" x2="50" y2="212" stroke="#1e40af" stroke-width="2"/>
    <line x1="100" y1="166" x2="100" y2="212" stroke="#1e40af" stroke-width="2"/>
    <line x1="150" y1="166" x2="150" y2="212" stroke="#1e40af" stroke-width="2"/>
    <text class="label" x="100" y="195" text-anchor="middle">1 whole</text>

    <rect x="250" y="166" width="200" height="46" rx="10" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
    <rect x="250" y="166" width="150" height="46" rx="10" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
    <line x1="300" y1="166" x2="300" y2="212" stroke="#1e40af" stroke-width="2"/>
    <line x1="350" y1="166" x2="350" y2="212" stroke="#1e40af" stroke-width="2"/>
    <line x1="400" y1="166" x2="400" y2="212" stroke="#1e40af" stroke-width="2"/>
    <text class="label green" x="325" y="195" text-anchor="middle">3/4</text>

    <text class="head green" x="258" y="256" text-anchor="middle">7/4 = 1 3/4</text>
  </g>

  <g transform="translate(80 476)">
    <text class="label" x="-6" y="-34">Number line check</text>
    <line x1="0" y1="0" x2="382" y2="0" stroke="#1e40af" stroke-width="4" marker-end="url(#fracArrow)"/>
    <g stroke="#1e40af" stroke-width="3">
      <line x1="0" y1="-13" x2="0" y2="13"/>
      <line x1="95.5" y1="-10" x2="95.5" y2="10"/>
      <line x1="191" y1="-13" x2="191" y2="13"/>
      <line x1="286.5" y1="-10" x2="286.5" y2="10"/>
      <line x1="382" y1="-13" x2="382" y2="13"/>
    </g>
    <circle cx="286.5" cy="0" r="9" fill="#047857"/>
    <text class="small" x="0" y="32" text-anchor="middle">0</text>
    <text class="small" x="191" y="32" text-anchor="middle">1</text>
    <text class="small green" x="286.5" y="-20" text-anchor="middle">7/4</text>
    <text class="small" x="382" y="32" text-anchor="middle">2</text>
  </g>

  <line x1="520" y1="122" x2="520" y2="520" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>

  <text class="head" x="554" y="130">2. Fraction of a set</text>
  <text class="body" x="554" y="156">3/4 of 20: make 4 equal groups, then take 3.</text>

  <g transform="translate(562 198)">
    <g>
      <rect x="0" y="0" width="88" height="150" rx="14" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
      <rect x="102" y="0" width="88" height="150" rx="14" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
      <rect x="204" y="0" width="88" height="150" rx="14" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
      <rect x="306" y="0" width="88" height="150" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
      <g fill="#ffffff" stroke="#1e3a5f" stroke-width="2">
        <circle cx="26" cy="28" r="9"/><circle cx="62" cy="28" r="9"/><circle cx="26" cy="62" r="9"/><circle cx="62" cy="62" r="9"/><circle cx="44" cy="104" r="9"/>
        <circle cx="128" cy="28" r="9"/><circle cx="164" cy="28" r="9"/><circle cx="128" cy="62" r="9"/><circle cx="164" cy="62" r="9"/><circle cx="146" cy="104" r="9"/>
        <circle cx="230" cy="28" r="9"/><circle cx="266" cy="28" r="9"/><circle cx="230" cy="62" r="9"/><circle cx="266" cy="62" r="9"/><circle cx="248" cy="104" r="9"/>
        <circle cx="332" cy="28" r="9"/><circle cx="368" cy="28" r="9"/><circle cx="332" cy="62" r="9"/><circle cx="368" cy="62" r="9"/><circle cx="350" cy="104" r="9"/>
      </g>
      <text class="small green" x="146" y="180" text-anchor="middle">take 3 groups</text>
      <text class="small" x="350" y="180" text-anchor="middle">leave 1 group</text>
    </g>

    <line x1="198" y1="202" x2="198" y2="228" stroke="#1e40af" stroke-width="4" marker-end="url(#fracArrow)"/>
    <text class="label" x="198" y="242" text-anchor="middle">20 ÷ 4 = 5 each; 5 × 3 = 15</text>
    <text class="head green" x="198" y="272" text-anchor="middle">3/4 of 20 = 15</text>
  </g>

  <g transform="translate(550 488)">
    <rect x="0" y="0" width="372" height="72" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text class="label red" x="186" y="25" text-anchor="middle">Common mistake</text>
    <text class="small" x="186" y="50" text-anchor="middle">unequal parts do not make a valid fraction model</text>
  </g>
</svg>
