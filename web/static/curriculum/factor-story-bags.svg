<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" role="img" aria-label="Equal bags: 18 apples and 24 oranges, one failed try with 4 bags and the answer with 6 bags">
  <rect width="1180" height="640" fill="#ffffff"/>
  <text x="40" y="50" text-anchor="start" style="font:900 28px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1e40af">Story: 18 apples and 24 oranges, equal bags, nothing left over</text>
  <text x="40" y="80" text-anchor="start" style="font:700 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b">First decide the picture: one total split exactly = bags.</text>
  <text x="40" y="125" text-anchor="start" style="font:900 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b91c1c">Try 4 bags: leftovers, so 4 fails</text>
