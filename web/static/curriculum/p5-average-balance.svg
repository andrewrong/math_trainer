<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="42" y="62" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#1e40af">Average means equal sharing of a total</text>
  <text x="42" y="94" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">Make the columns level: total stays the same, each share becomes equal.</text>
  <g transform="translate(110 155)">
    <rect x="0" y="180" width="80" height="80" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <rect x="110" y="140" width="80" height="120" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <rect x="220" y="100" width="80" height="160" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
    <text x="24" y="292" font-family="Inter, Arial, sans-serif" font-size="20" fill="#374151">6</text>
    <text x="134" y="292" font-family="Inter, Arial, sans-serif" font-size="20" fill="#374151">8</text>
    <text x="238" y="292" font-family="Inter, Arial, sans-serif" font-size="20" fill="#374151">10</text>
  </g>
  <path d="M460 290 H540" stroke="#1e3a5f" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(610 155)">
    <rect x="0" y="140" width="80" height="120" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <rect x="110" y="140" width="80" height="120" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <rect x="220" y="140" width="80" height="120" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <text x="24" y="292" font-family="Inter, Arial, sans-serif" font-size="20" fill="#374151">8</text>
    <text x="134" y="292" font-family="Inter, Arial, sans-serif" font-size="20" fill="#374151">8</text>
    <text x="244" y="292" font-family="Inter, Arial, sans-serif" font-size="20" fill="#374151">8</text>
  </g>
  <rect x="310" y="424" width="360" height="72" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="356" y="456" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a5f">6 + 8 + 10 = 24</text>
  <text x="384" y="484" font-family="Inter, Arial, sans-serif" font-size="18" fill="#374151">24 shared by 3 = 8 average</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1e3a5f"/></marker>
  </defs>
</svg>
