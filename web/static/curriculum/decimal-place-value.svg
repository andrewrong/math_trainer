<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" role="img" aria-label="Decimal place value, equivalent decimals, comparison, and money subtraction">
  <desc>$10.00 - $6.87 = $3.13</desc>
  <rect width="1160" height="700" fill="#ffffff"/>
  <style>
    .title{font:900 30px Arial,sans-serif;fill:#1e40af}
    .sub{font:700 18px Arial,sans-serif;fill:#64748b}
    .head{font:900 21px Arial,sans-serif;fill:#1e40af}
    .body{font:700 15px Arial,sans-serif;fill:#64748b}
    .label{font:900 14px Arial,sans-serif;fill:#374151}
    .small{font:800 13px Arial,sans-serif;fill:#64748b}
    .tiny{font:800 11px Arial,sans-serif;fill:#64748b}
    .math{font:900 22px Arial,sans-serif;fill:#1e3a5f}
    .green{fill:#047857}
    .orange{fill:#c2410c}
    .red{fill:#dc2626}
  </style>

  <text class="title" x="42" y="56">Decimals continue place value after ones</text>
  <text class="sub" x="44" y="88">Tenths, hundredths, thousandths, dollars and cents all follow place value.</text>
  <g transform="translate(778 22)">
    <rect x="0" y="0" width="350" height="86" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text class="label orange" x="18" y="26">Decimal point = place-value fence</text>
    <text class="small" x="18" y="52">Decimal gate: unit -&gt; place -&gt; estimate -&gt; format</text>
    <text class="small" x="18" y="72">keep the fence when comparing and writing money</text>
  </g>

  <rect x="42" y="122" width="520" height="226" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="head" x="68" y="160">1. Read the place</text>
  <text class="body" x="68" y="184">4.307 has no hundredths.</text>
  <g transform="translate(68 210)">
    <rect x="0" y="0" width="68" height="84" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
    <text class="math" x="34" y="34" text-anchor="middle">4</text>
    <text class="label" x="34" y="60" text-anchor="middle">ones</text>
    <rect x="80" y="0" width="42" height="84" rx="12" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
    <text class="math orange" x="101" y="38" text-anchor="middle">.</text>
    <text class="label" x="101" y="60" text-anchor="middle">point</text>
    <rect x="134" y="0" width="76" height="84" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
    <text class="math" x="172" y="34" text-anchor="middle">3</text>
    <text class="label" x="172" y="60" text-anchor="middle">tenths</text>
    <rect x="222" y="0" width="86" height="84" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
    <text class="math" x="265" y="34" text-anchor="middle">0</text>
    <text class="label" x="265" y="60" text-anchor="middle">hundredths</text>
    <rect x="320" y="0" width="96" height="84" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
    <text class="math" x="368" y="34" text-anchor="middle">7</text>
    <text class="label" x="368" y="60" text-anchor="middle">thousandths</text>
  </g>
  <rect x="68" y="314" width="468" height="42" rx="13" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
  <text class="math green" x="302" y="342" text-anchor="middle">4.307 = 4 + 3/10 + 0/100 + 7/1000</text>

  <rect x="600" y="122" width="518" height="226" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="head" x="626" y="160">2. Extra zeros can keep value</text>
  <text class="body" x="626" y="184">0.6 means 6 tenths. 0.60 means 60 hundredths.</text>
  <g transform="translate(632 214)">
    <text class="math" x="0" y="28">0.6</text>
    <rect x="70" y="0" width="260" height="34" rx="8" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
    <rect x="70" y="0" width="156" height="34" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
    <g stroke="#1e40af" stroke-width="1">
      <line x1="96" y1="0" x2="96" y2="34"/><line x1="122" y1="0" x2="122" y2="34"/><line x1="148" y1="0" x2="148" y2="34"/><line x1="174" y1="0" x2="174" y2="34"/><line x1="200" y1="0" x2="200" y2="34"/><line x1="226" y1="0" x2="226" y2="34"/><line x1="252" y1="0" x2="252" y2="34"/><line x1="278" y1="0" x2="278" y2="34"/><line x1="304" y1="0" x2="304" y2="34"/>
    </g>
    <text class="label green" x="148" y="64" text-anchor="middle">6 tenths</text>
    <text class="math" x="0" y="124">0.60</text>
    <rect x="70" y="82" width="130" height="90" rx="8" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
    <rect x="70" y="82" width="78" height="90" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
    <g stroke="#1e40af" stroke-width="1">
      <line x1="83" y1="82" x2="83" y2="172"/><line x1="96" y1="82" x2="96" y2="172"/><line x1="109" y1="82" x2="109" y2="172"/><line x1="122" y1="82" x2="122" y2="172"/><line x1="135" y1="82" x2="135" y2="172"/><line x1="148" y1="82" x2="148" y2="172"/><line x1="161" y1="82" x2="161" y2="172"/><line x1="174" y1="82" x2="174" y2="172"/><line x1="187" y1="82" x2="187" y2="172"/>
      <line x1="70" y1="91" x2="200" y2="91"/><line x1="70" y1="100" x2="200" y2="100"/><line x1="70" y1="109" x2="200" y2="109"/><line x1="70" y1="118" x2="200" y2="118"/><line x1="70" y1="127" x2="200" y2="127"/><line x1="70" y1="136" x2="200" y2="136"/><line x1="70" y1="145" x2="200" y2="145"/><line x1="70" y1="154" x2="200" y2="154"/><line x1="70" y1="163" x2="200" y2="163"/>
    </g>
    <text class="label green" x="318" y="120" text-anchor="middle">same shaded amount</text>
    <rect x="252" y="42" width="174" height="42" rx="13" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
    <text class="math green" x="339" y="70" text-anchor="middle">0.6 = 0.60</text>
  </g>

  <rect x="42" y="390" width="520" height="230" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text class="head" x="68" y="428">3. Compare by lining up places</text>
  <text class="body" x="68" y="452">Add zeros only to compare the same place.</text>
  <g transform="translate(78 480)">
    <rect x="0" y="0" width="430" height="74" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text class="math" x="82" y="31" text-anchor="middle">0.305</text>
    <text class="label" x="82" y="55" text-anchor="middle">305 thousandths</text>
    <text class="math" x="205" y="42" text-anchor="middle">&lt;</text>
    <text class="math orange" x="322" y="31" text-anchor="middle">0.350</text>
    <text class="label" x="322" y="55" text-anchor="middle">350 thousandths</text>
  </g>
  <rect x="78" y="578" width="430" height="42" rx="13" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text class="label red" x="293" y="604" text-anchor="middle">More decimal digits does not always mean bigger.</text>

  <rect x="600" y="390" width="518" height="270" rx="20" fill="#f4faed" stroke="#a7f3d0" stroke-width="2"/>
  <text class="head" x="626" y="428">4. Money: line up decimal points</text>
  <text class="body" x="626" y="452">A toy costs $6.87. Maya pays $10.00.</text>
  <g transform="translate(676 486)">
    <text class="small" x="76" y="0" text-anchor="middle">dollars</text>
    <text class="small" x="184" y="0" text-anchor="middle">cents</text>
    <text class="math" x="190" y="42" text-anchor="end">$10.00</text>
    <text class="math" x="190" y="78" text-anchor="end">- $6.87</text>
    <line x1="44" y1="96" x2="202" y2="96" stroke="#1e3a5f" stroke-width="3"/>
    <text class="math green" x="190" y="130" text-anchor="end">$3.13</text>
    <line x1="120" y1="10" x2="120" y2="138" stroke="#c2410c" stroke-width="3" stroke-dasharray="7 7"/>
    <text class="label orange" x="120" y="162" text-anchor="middle">decimal points stay in one column</text>
  </g>
  <rect x="888" y="466" width="220" height="170" rx="14" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
  <text class="label green" x="998" y="490" text-anchor="middle">$10.00 - $6.87</text>
  <text class="math green" x="998" y="518" text-anchor="middle">= $3.13</text>
  <text class="tiny" x="998" y="548" text-anchor="middle">1000c - 687c = 313c</text>
  <text class="tiny" x="998" y="576" text-anchor="middle">313c is a check, not the answer</text>
  <text class="label green" x="998" y="604" text-anchor="middle">final gate: $ + 2 decimals</text>
  <text class="label green" x="998" y="626" text-anchor="middle">final answer must be $3.13</text>
</svg>
