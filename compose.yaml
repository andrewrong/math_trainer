services:
  math_trainer:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MATH_TRAINER_HOME:?set MATH_TRAINER_HOME to the service directory}/config.yaml:/app/config.yaml:ro
      - ${MATH_TRAINER_HOME:?set MATH_TRAINER_HOME to the service directory}/secrets/google_adc.json:/app/.secrets/google_adc.json:ro
      - ${MATH_TRAINER_HOME:?set MATH_TRAINER_HOME to the service directory}/data:/app/data
      - ${MATH_TRAINER_HOME:?set MATH_TRAINER_HOME to the service directory}/tts:/app/web/audio/tts
      - ${MATH_TRAINER_HOME:?set MATH_TRAINER_HOME to the service directory}/reading:/app/resources/reading
      - ${MATH_TRAINER_HOME:?set MATH_TRAINER_HOME to the service directory}/logs:/app/logs
