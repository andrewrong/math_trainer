  <text x="355" y="200" text-anchor="middle" style="font:900 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151">6 oranges</text>
  <rect x="430" y="140" width="120" height="90" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="485" y="170" text-anchor="middle" style="font:900 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151">4 apples</text>
  <text x="485" y="200" text-anchor="middle" style="font:900 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#374151">6 oranges</text>
  <rect x="570" y="140" width="200" height="90" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
