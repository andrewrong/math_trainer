<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-label="Factors split totals exactly; multiples are repeated jumps; common means shared by both lists">
  <rect width="1180" height="720" fill="#ffffff"/>
  <style>
    .title{font:900 32px Arial,sans-serif;fill:#1e40af}
    .sub{font:700 18px Arial,sans-serif;fill:#64748b}
    .head{font:900 24px Arial,sans-serif;fill:#1e40af}
    .q{font:900 18px Arial,sans-serif;fill:#374151}
    .body{font:700 15px Arial,sans-serif;fill:#64748b}
    .small{font:800 13px Arial,sans-serif;fill:#64748b}
    .num{font:900 16px Arial,sans-serif;fill:#374151}
    .answer{font:900 20px Arial,sans-serif;fill:#047857}
    .orange{fill:#c2410c}
    .green{fill:#047857}
  </style>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#1e40af"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#047857"/>
    </marker>
  </defs>

  <text class="title" x="40" y="54">Factors and multiples answer different questions</text>
  <text class="sub" x="42" y="88">Do not memorise two word lists. Ask what the story is doing first.</text>

  <g transform="translate(42 118)">
    <rect x="0" y="0" width="1096" height="76" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text class="q orange" x="28" y="30">Decision gate</text>
    <text class="body" x="28" y="56">one fixed total split exactly → FACTOR · repeated jumps meet again → MULTIPLE · both numbers → COMMON</text>
  </g>

  <line x1="590" y1="212" x2="590" y2="665" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>

  <text class="head" x="54" y="240">FACTOR: one total splits exactly</text>
  <text class="q" x="54" y="270">Can 24 split with no leftover?</text>
  <g transform="translate(64 300)">
    <rect x="0" y="0" width="190" height="146" rx="16" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
    <text x="95" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#1e40af">24</text>
    <text x="95" y="62" text-anchor="middle" class="small">4 rows × 6 columns</text>
    <g fill="#3b82f6" stroke="#1e3a5f" stroke-width="1">
      <circle cx="38" cy="82" r="5"/><circle cx="60" cy="82" r="5"/><circle cx="82" cy="82" r="5"/><circle cx="104" cy="82" r="5"/><circle cx="126" cy="82" r="5"/><circle cx="148" cy="82" r="5"/>
      <circle cx="38" cy="100" r="5"/><circle cx="60" cy="100" r="5"/><circle cx="82" cy="100" r="5"/><circle cx="104" cy="100" r="5"/><circle cx="126" cy="100" r="5"/><circle cx="148" cy="100" r="5"/>
      <circle cx="38" cy="118" r="5"/><circle cx="60" cy="118" r="5"/><circle cx="82" cy="118" r="5"/><circle cx="104" cy="118" r="5"/><circle cx="126" cy="118" r="5"/><circle cx="148" cy="118" r="5"/>
      <circle cx="38" cy="136" r="5"/><circle cx="60" cy="136" r="5"/><circle cx="82" cy="136" r="5"/><circle cx="104" cy="136" r="5"/><circle cx="126" cy="136" r="5"/><circle cx="148" cy="136" r="5"/>
    </g>
  </g>
  <line x1="270" y1="373" x2="330" y2="373" stroke="#1e40af" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <g transform="translate(346 286)">
    <text class="q" x="0" y="0">Factor-pair T-chart</text>
    <line x1="0" y1="12" x2="188" y2="12" stroke="#c2410c" stroke-width="2"/>
    <text class="num" x="0" y="42">1 × 24</text>
    <text class="num" x="0" y="72">2 × 12</text>
    <text class="num" x="0" y="102">3 × 8</text>
    <text class="num" x="0" y="132">4 × 6</text>
    <text class="answer" x="0" y="174">no remainder = factor</text>
  </g>

  <text class="head" x="628" y="240">MULTIPLE: jumps land again</text>
  <text class="q" x="628" y="270">When do jumps of 6 and 8 meet?</text>
  <g transform="translate(646 318)">
    <text x="0" y="-20" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="#1e40af">jump by 6</text>
    <line x1="70" y1="0" x2="404" y2="0" stroke="#1e40af" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <g stroke="#1e40af" stroke-width="2">
      <line x1="70" y1="-12" x2="70" y2="12"/><line x1="126" y1="-12" x2="126" y2="12"/><line x1="182" y1="-12" x2="182" y2="12"/><line x1="238" y1="-12" x2="238" y2="12"/><line x1="294" y1="-30" x2="294" y2="132"/><line x1="350" y1="-12" x2="350" y2="12"/><line x1="406" y1="-12" x2="406" y2="12"/>
    </g>
    <g class="num">
      <text x="70" y="34" text-anchor="middle">0</text><text x="126" y="34" text-anchor="middle">6</text><text x="182" y="34" text-anchor="middle">12</text><text x="238" y="34" text-anchor="middle">18</text><text x="294" y="34" text-anchor="middle">24</text><text x="350" y="34" text-anchor="middle">30</text><text x="406" y="34" text-anchor="middle">36</text>
    </g>
    <text x="0" y="104" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="#047857">jump by 8</text>
    <line x1="70" y1="124" x2="404" y2="124" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <g stroke="#047857" stroke-width="2">
      <line x1="70" y1="112" x2="70" y2="136"/><line x1="144" y1="112" x2="144" y2="136"/><line x1="219" y1="112" x2="219" y2="136"/><line x1="294" y1="112" x2="294" y2="136"/><line x1="369" y1="112" x2="369" y2="136"/>
    </g>
    <g class="num">
      <text x="70" y="158" text-anchor="middle">0</text><text x="144" y="158" text-anchor="middle">8</text><text x="219" y="158" text-anchor="middle">16</text><text x="294" y="158" text-anchor="middle">24</text><text x="369" y="158" text-anchor="middle">32</text>
    </g>
    <ellipse cx="294" cy="62" rx="60" ry="48" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="294" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="900" fill="#b45309">meet at</text>
    <text x="294" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="#b45309">24</text>
  </g>

  <g transform="translate(54 520)">
    <rect x="0" y="0" width="504" height="124" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
    <text class="q green" x="20" y="30">COMMON means shared by both lists</text>
    <text class="small" x="20" y="58">18: 1, 2, 3, 6, 9, 18</text>
    <text class="small" x="20" y="82">24: 1, 2, 3, 4, 6, 8, 12, 24</text>
    <text class="answer" x="20" y="110">shared: 1, 2, 3, 6 → GCF = 6</text>
  </g>

  <g transform="translate(628 520)">
    <rect x="0" y="0" width="500" height="124" rx="16" fill="#eff6ff" stroke="#1e40af" stroke-width="3"/>
    <text class="q" x="20" y="30">COMMON landing points solve cycle stories</text>
    <text class="small" x="20" y="58">6: 6, 12, 18, 24, 30, 36, 42, 48</text>
    <text class="small" x="20" y="82">8: 8, 16, 24, 32, 40, 48</text>
    <text class="answer" x="20" y="110">first shared landing → LCM = 24</text>
  </g>
</svg>
