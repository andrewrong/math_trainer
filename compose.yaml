name: math_trainer

services:
  math_trainer:
    build: .
    image: ${CREW_IMAGE:?set CREW_IMAGE to the image of the release}
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ${CREW_SECRETS:?set CREW_SECRETS to the directory of service secrets}/math_trainer.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CREW_SERVICE_DIR:?set CREW_SERVICE_DIR to the service directory}/config/config.yaml:/app/config.yaml:ro
      - ${CREW_SECRETS:?set CREW_SECRETS to the directory of service secrets}/math_trainer.google_adc.json:/app/.secrets/google_adc.json:ro
      - ${CREW_SERVICE_DIR:?set CREW_SERVICE_DIR to the service directory}/data/db:/app/data
      - ${CREW_SERVICE_DIR:?set CREW_SERVICE_DIR to the service directory}/data/tts:/app/web/audio/tts
      - ${CREW_SERVICE_DIR:?set CREW_SERVICE_DIR to the service directory}/data/reading:/app/resources/reading
      - ${CREW_SERVICE_DIR:?set CREW_SERVICE_DIR to the service directory}/data/logs:/app/logs
